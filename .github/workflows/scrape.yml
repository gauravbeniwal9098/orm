name: Multi-Platform Review Report Generator

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-all:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests beautifulsoup4 google-play-scraper

      - name: Run Master ZenRows Review Scraper
        run: python scraper.py

      - name: Auto Commit Dashboard & Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html report.html reviews_database.json *.csv
          git commit -m "Auto sync live review dashboard [skip ci]" || echo "No changes to commit"
          git push
