name: Multi-Platform Review Report Generator

on:
  schedule:
    - cron: '0 0 * * 5'  # Har Friday ko apne aap chalega
  workflow_dispatch:      # Aap khud manually bhi chala sakte hain

permissions:
  contents: write

jobs:
  scrape-all:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Platform Scraper & Generate HTML Report
        run: python scraper.py

      - name: Save CSV and HTML Report to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv report.html
          git commit -m "Automated Weekly Reviews Report [skip ci]" || echo "No changes to commit"
          git push
