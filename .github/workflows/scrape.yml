name: Multi-Platform Review Report Generator

on:
  schedule:
    - cron: '0 2 * * *'  # Har roz subah live run hoga
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  scrape-all:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Master Scraper Engine
        env:
          SCRAPER_API_KEY: "20bda77b6873229d657469b817a75238"
          GLASSDOOR_COOKIE: ${{ secrets.GLASSDOOR_COOKIE }}
          INDEED_COOKIE: ${{ secrets.INDEED_COOKIE }}
        run: python scraper.py

      - name: Auto Commit Dashboard & Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html report.html *.csv
          git commit -m "Authenticated Live Reviews Update [skip ci]" || echo "No changes to commit"
          git push
