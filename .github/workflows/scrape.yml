name: Multi-Platform Review Report Generator

on:
  schedule:
    - cron: '0 2 * * *'  # Har roz subah 7:30 AM IST par background mein apne aap chalega
  workflow_dispatch:      # Manual 'Run workflow' button ke liye

permissions:
  contents: write         # Bot ko files commit aur push karne ki poori permission

jobs:
  scrape-all:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Platform Scraper & Generate HTML Report
        run: python scraper.py

      - name: Save CSV, index.html and report.html to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html report.html *.csv
          git commit -m "Automated Reviews & Dashboard Update [skip ci]" || echo "No changes to commit"
          git push
